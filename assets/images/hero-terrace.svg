<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated Victorian terrace on Nunhead Green">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dfd1"/>
      <stop offset="65%" stop-color="#f2eadf"/>
      <stop offset="100%" stop-color="#fbf6ee"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="380" fill="url(#heroSky)"/>

  <!-- Sun -->
  <circle cx="650" cy="90" r="38" fill="#d98b6f" opacity="0.55"/>
  <circle cx="650" cy="90" r="24" fill="#d98b6f" opacity="0.4"/>

  <!-- Clouds -->
  <ellipse cx="180" cy="70" rx="55" ry="9" fill="#fbf6ee" opacity="0.8"/>
  <ellipse cx="220" cy="65" rx="38" ry="7" fill="#fbf6ee" opacity="0.8"/>
  <ellipse cx="450" cy="105" rx="48" ry="8" fill="#fbf6ee" opacity="0.7"/>

  <!-- Birds -->
  <path d="M 95 130 Q 103 122 111 130 Q 119 122 127 130" stroke="#2b2622" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M 145 150 Q 151 144 157 150 Q 163 144 169 150" stroke="#2b2622" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Distant hills -->
  <g opacity="0.35">
    <ellipse cx="60" cy="260" rx="80" ry="32" fill="#5a7a5f"/>
    <ellipse cx="740" cy="260" rx="85" ry="34" fill="#5a7a5f"/>
  </g>

  <!-- VICTORIAN TERRACE: 5 houses -->

  <!-- House 1 — buff brick -->
  <g>
    <rect x="80" y="170" width="115" height="170" fill="#d4a574" stroke="#5a524a" stroke-width="1.2"/>
    <polygon points="78,170 137,135 196,170" fill="#5a524a"/>
    <rect x="155" y="125" width="14" height="22" fill="#4a4038"/>
    <rect x="153" y="122" width="18" height="6" fill="#4a4038"/>
    <!-- Bay window -->
    <polygon points="92,265 92,225 112,215 142,215 162,225 162,265" fill="#4a6b4f" stroke="#2b2622" stroke-width="1"/>
    <rect x="98" y="222" width="12" height="38" fill="#fbf6ee" opacity="0.75"/>
    <rect x="115" y="217" width="24" height="43" fill="#fbf6ee" opacity="0.75"/>
    <rect x="144" y="222" width="12" height="38" fill="#fbf6ee" opacity="0.75"/>
    <!-- Top sash windows -->
    <rect x="98" y="190" width="22" height="28" fill="#fbf6ee" stroke="#2b2622" stroke-width="1"/>
    <line x1="109" y1="190" x2="109" y2="218" stroke="#2b2622" stroke-width="0.7"/>
    <line x1="98" y1="204" x2="120" y2="204" stroke="#2b2622" stroke-width="0.7"/>
    <rect x="135" y="190" width="22" height="28" fill="#fbf6ee" stroke="#2b2622" stroke-width="1"/>
    <line x1="146" y1="190" x2="146" y2="218" stroke="#2b2622" stroke-width="0.7"/>
    <line x1="135" y1="204" x2="157" y2="204" stroke="#2b2622" stroke-width="0.7"/>
    <!-- Door -->
    <rect x="170" y="285" width="22" height="55" fill="#2b2622" stroke="#2b2622" stroke-width="1"/>
    <circle cx="187" cy="315" r="1.5" fill="#d4a574"/>
  </g>

  <!-- House 2 — white painted (this is "us" — 31 Nunhead Green) -->
  <g>
    <rect x="195" y="160" width="115" height="180" fill="#fbf6ee" stroke="#5a524a" stroke-width="1.2"/>
    <polygon points="193,160 252,125 311,160" fill="#4a4038"/>
    <rect x="270" y="115" width="14" height="22" fill="#4a4038"/>
    <rect x="268" y="112" width="18" height="6" fill="#4a4038"/>
    <!-- Bay window -->
    <polygon points="207,265 207,218 227,208 257,208 277,218 277,265" fill="#4a6b4f" stroke="#2b2622" stroke-width="1"/>
    <rect x="213" y="215" width="12" height="45" fill="#fbf6ee" opacity="0.75"/>
    <rect x="230" y="210" width="24" height="50" fill="#fbf6ee" opacity="0.75"/>
    <rect x="259" y="215" width="12" height="45" fill="#fbf6ee" opacity="0.75"/>
    <!-- Top windows -->
    <rect x="213" y="183" width="22" height="28" fill="#fbf6ee" stroke="#2b2622" stroke-width="1"/>
    <line x1="224" y1="183" x2="224" y2="211" stroke="#2b2622" stroke-width="0.7"/>
    <line x1="213" y1="197" x2="235" y2="197" stroke="#2b2622" stroke-width="0.7"/>
    <rect x="250" y="183" width="22" height="28" fill="#fbf6ee" stroke="#2b2622" stroke-width="1"/>
    <line x1="261" y1="183" x2="261" y2="211" stroke="#2b2622" stroke-width="0.7"/>
    <line x1="250" y1="197" x2="272" y2="197" stroke="#2b2622" stroke-width="0.7"/>
    <!-- Front door — blue, like the photo -->
    <rect x="285" y="285" width="22" height="55" fill="#3a5878" stroke="#2b2622" stroke-width="1"/>
    <circle cx="302" cy="315" r="1.5" fill="#d4a574"/>
    <!-- Number plaque -->
    <rect x="288" y="278" width="16" height="6" fill="#2b2622"/>
  </g>

  <!-- House 3 — terracotta brick -->
  <g>
    <rect x="310" y="172" width="115" height="168" fill="#b8553a" stroke="#5a524a" stroke-width="1.2"/>
    <polygon points="308,172 367,138 426,172" fill="#5a524a"/>
    <rect x="385" y="128" width="14" height="22" fill="#4a4038"/>
    <rect x="383" y="125" width="18" height="6" fill="#4a4038"/>
    <!-- Bay window -->
    <polygon points="322,265 322,228 342,218 372,218 392,228 392,265" fill="#4a6b4f" stroke="#2b2622" stroke-width="1"/>
    <rect x="328" y="225" width="12" height="35" fill="#fbf6ee" opacity="0.75"/>
    <rect x="345" y="220" width="24" height="40" fill="#fbf6ee" opacity="0.75"/>
    <rect x="374" y="225" width="12" height="35" fill="#fbf6ee" opacity="0.75"/>
    <!-- Top windows -->
    <rect x="328" y="192" width="22" height="28" fill="#fbf6ee" stroke="#2b2622" stroke-width="1"/>
    <line x1="339" y1="192" x2="339" y2="220" stroke="#2b2622" stroke-width="0.7"/>
    <line x1="328" y1="206" x2="350" y2="206" stroke="#2b2622" stroke-width="0.7"/>
    <rect x="365" y="192" width="22" height="28" fill="#fbf6ee" stroke="#2b2622" stroke-width="1"/>
    <line x1="376" y1="192" x2="376" y2="220" stroke="#2b2622" stroke-width="0.7"/>
    <line x1="365" y1="206" x2="387" y2="206" stroke="#2b2622" stroke-width="0.7"/>
    <!-- Door -->
    <rect x="400" y="285" width="22" height="55" fill="#2b2622" stroke="#2b2622" stroke-width="1"/>
    <circle cx="417" cy="315" r="1.5" fill="#d4a574"/>
  </g>

  <!-- House 4 — white painted -->
  <g>
    <rect x="425" y="165" width="115" height="175" fill="#fbf6ee" stroke="#5a524a" stroke-width="1.2"/>
    <polygon points="423,165 482,130 541,165" fill="#4a4038"/>
    <rect x="500" y="120" width="14" height="22" fill="#4a4038"/>
    <rect x="498" y="117" width="18" height="6" fill="#4a4038"/>
    <!-- Bay window -->
    <polygon points="437,265 437,222 457,212 487,212 507,222 507,265" fill="#4a6b4f" stroke="#2b2622" stroke-width="1"/>
    <rect x="443" y="219" width="12" height="41" fill="#fbf6ee" opacity="0.75"/>
    <rect x="460" y="214" width="24" height="46" fill="#fbf6ee" opacity="0.75"/>
    <rect x="489" y="219" width="12" height="41" fill="#fbf6ee" opacity="0.75"/>
    <!-- Top windows -->
    <rect x="443" y="187" width="22" height="28" fill="#fbf6ee" stroke="#2b2622" stroke-width="1"/>
    <line x1="454" y1="187" x2="454" y2="215" stroke="#2b2622" stroke-width="0.7"/>
    <line x1="443" y1="201" x2="465" y2="201" stroke="#2b2622" stroke-width="0.7"/>
    <rect x="480" y="187" width="22" height="28" fill="#fbf6ee" stroke="#2b2622" stroke-width="1"/>
    <line x1="491" y1="187" x2="491" y2="215" stroke="#2b2622" stroke-width="0.7"/>
    <line x1="480" y1="201" x2="502" y2="201" stroke="#2b2622" stroke-width="0.7"/>
    <!-- Door -->
    <rect x="515" y="285" width="22" height="55" fill="#4a6b4f" stroke="#2b2622" stroke-width="1"/>
    <circle cx="532" cy="315" r="1.5" fill="#d4a574"/>
  </g>

  <!-- House 5 — buff brick -->
  <g>
    <rect x="540" y="170" width="115" height="170" fill="#d4a574" stroke="#5a524a" stroke-width="1.2"/>
    <polygon points="538,170 597,135 656,170" fill="#5a524a"/>
    <rect x="615" y="125" width="14" height="22" fill="#4a4038"/>
    <rect x="613" y="122" width="18" height="6" fill="#4a4038"/>
    <!-- Bay window -->
    <polygon points="552,265 552,225 572,215 602,215 622,225 622,265" fill="#4a6b4f" stroke="#2b2622" stroke-width="1"/>
    <rect x="558" y="222" width="12" height="38" fill="#fbf6ee" opacity="0.75"/>
    <rect x="575" y="217" width="24" height="43" fill="#fbf6ee" opacity="0.75"/>
    <rect x="604" y="222" width="12" height="38" fill="#fbf6ee" opacity="0.75"/>
    <!-- Top windows -->
    <rect x="558" y="190" width="22" height="28" fill="#fbf6ee" stroke="#2b2622" stroke-width="1"/>
    <line x1="569" y1="190" x2="569" y2="218" stroke="#2b2622" stroke-width="0.7"/>
    <line x1="558" y1="204" x2="580" y2="204" stroke="#2b2622" stroke-width="0.7"/>
    <rect x="595" y="190" width="22" height="28" fill="#fbf6ee" stroke="#2b2622" stroke-width="1"/>
    <line x1="606" y1="190" x2="606" y2="218" stroke="#2b2622" stroke-width="0.7"/>
    <line x1="595" y1="204" x2="617" y2="204" stroke="#2b2622" stroke-width="0.7"/>
    <!-- Door -->
    <rect x="630" y="285" width="22" height="55" fill="#2b2622" stroke="#2b2622" stroke-width="1"/>
    <circle cx="647" cy="315" r="1.5" fill="#d4a574"/>
  </g>

  <!-- Tree silhouettes flanking the terrace -->
  <g>
    <rect x="55" y="240" width="6" height="100" fill="#5a3a2a"/>
    <circle cx="58" cy="225" r="35" fill="#4a6b4f"/>
    <circle cx="42" cy="240" r="22" fill="#5a7a5f"/>
    <circle cx="75" cy="240" r="24" fill="#5a7a5f"/>
  </g>
  <g>
    <rect x="715" y="245" width="7" height="95" fill="#5a3a2a"/>
    <circle cx="718" cy="230" r="38" fill="#4a6b4f"/>
    <circle cx="700" cy="245" r="24" fill="#5a7a5f"/>
    <circle cx="738" cy="245" r="22" fill="#5a7a5f"/>
  </g>

  <!-- Foreground hedge / pavement -->
  <rect x="0" y="340" width="800" height="40" fill="#5a524a"/>
  <rect x="0" y="335" width="800" height="8" fill="#4a4038"/>

  <!-- Pedestrian -->
  <g transform="translate(380, 320)">
    <circle cx="0" cy="0" r="5" fill="#2b2622"/>
    <rect x="-4" y="5" width="8" height="14" fill="#b8553a"/>
    <line x1="0" y1="19" x2="-3" y2="32" stroke="#2b2622" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="19" x2="3" y2="32" stroke="#2b2622" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
