<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="{{ site.theme_color }}">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="{{ page.description | default: site.description }}">
<title>{{ page.title | default: site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

{% include header.html %}

<main id="main">
  {{ content }}
</main>

{% include footer.html %}

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>

</body>
</html>
